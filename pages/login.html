<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RolêPet - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/index.css">    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="login-body">

<!-- HEADER -->
    <header class="login-header">
        <img src="../assets/img/logo-slogan.png" alt="Logo RolêPet" >
    </header>

<!-- MAIN -->
    <main class="login-main">
        <h2>Entrar na sua conta</h2>

        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
            <input type="email" id="email" class="form-control" placeholder="Seu e-mail">
        </div>

        <div class="input-group">
            <span class="input-group-text"><i class="fas fa-lock"></i></span>
            <input type="password" id="senha" class="form-control" placeholder="Sua senha">
        </div>

        <button class="btn-entrar">Entrar</button>

        <div class="divider">ou continue com</div>

        <div class="social-buttons">
            <button class="btn-social"><i class="fab fa-google"></i>Google</button>
            <button class="btn-social"><i class="fab fa-facebook-f"></i>Facebook</button>
            <button class="btn-social"><i class="fab fa-twitter"></i>Twitter</button>
        </div>

        <p class="link-cadastro">Não tem uma conta? <a href="/cadastro.html">Cadastre-se</a></p>

    </main>
    
    <script src="../js/login.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

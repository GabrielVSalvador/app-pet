<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passeio</title>
</head>
<body>
                <section class="passeadores">
                <div class="container">
                    <div class="row">
                        <div class="col-12 col-md-4">
                            <div class="card">
                                <img src="#" class="card-img-top" alt="MR">
                                <div class="card-body">
                                    <h5 class="card-title">Marina Rocha</h5>
                                    <p class="card-text"><span class="fa-solid fa-star"></span>4.9 &#124; 120 avaliações</p>
                                    <p class="card-text">89 passeios</p>
                                    <p class="card-text"><i class="fa-solid fa-circle" style="color: #28a745;"></i> Disponível</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-12 col-md-4">
                            <div class="card">
                                <img src="#" class="card-img-top" alt="CA">
                                <div class="card-body">
                                    <h5 class="card-title">Carlos Alves</h5>
                                    <p class="card-text"><span class="fa-solid fa-star"></span>4.8 &#124; 95 avaliações</p>
                                    <p class="card-text">76 passeios</p>
                                    <p class="card-text"><i class="fa-solid fa-circle" style="color: #28a745;"></i> Disponível</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-12 col-md-4">
                            <div class="card">
                                <img src="#" class="card-img-top" alt="JP">
                                <div class="card-body">
                                    <h5 class="card-title">João Pereira</h5>
                                    <p class="card-text"><span class="fa-solid fa-star"></span>4.7 &#124; 80 avaliações</p>
                                    <p class="card-text">65 passeios</p>
                                    <p class="card-text"><i class="fa-solid fa-clock" style="color: #808080;"></i> agendamento 11h</p>
                                    <div class="card-right">
                                        <input type="checkbox">
                                        <div class="preco">R$22</div>
                                        <div class="distancia">1.2 km</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
</body>
</html>

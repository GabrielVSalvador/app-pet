<!DOCTYPE html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>RolêPet</title>
        <link rel="stylesheet" href="/css/index.css">
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <header>
            <div class="header-top">
                <div></div>
                <div class="logo">
                    <i class="fa-solid fa-paw"></i>
                    <h3>RolêPet</h3>
                </div>
                <a href="#configuracoes"><i class="fa-solid fa-gear"></i></a>
            </div>
            <div class="profile-container">
                <a href="#perfil"><img src="#" alt="GS"></a>
                <h1>Olá, Gabriel Salvador!</h1>
            </div>
        </header>
        <main class="home">
            <section class="search-section">
                    <form>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-search"></i>
                            <input type="search" name="local" placeholder="Onde seu pet vai passear?">
                        </div>
                        <ul class="place-suggestions">
                            <li><i class="fa-solid fa-clock history-icon"></i>Praça Getulio Vargas</li>
                            <li><i class="fa-solid fa-clock history-icon" ></i>Parque das Flores</li>
                            <li><i class="fa-solid fa-clock history-icon"></i>Praça 1 de Maio</li>
                        </ul>                     
                    </form>
            </section>
        </main>
        <footer>
            <nav >
                <ul class="botton-nav">
                    <li class="service">
                        <a href="#home"><i class="fa-solid fa-dog"></i><span>Passeios</span></a>
                    </li>
                    <li class="service">
                        <a href="#produtos"><i class="fa-solid fa-bone"></i><span>Produtos</span></a>
                    </li>
                    <li class="service">
                        <a href="#petshops"><i class="fa-solid fa-store"></i><span>Petshops</span></a>
                    </li>
                </ul>
            </nav>
        </footer>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
